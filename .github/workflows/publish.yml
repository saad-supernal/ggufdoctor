name: Publish to PyPI

# Trusted publishing: no API token is stored anywhere. PyPI must be told to
# trust this repository + workflow once (project settings -> Publishing ->
# add a GitHub publisher with owner saad-supernal, repo ggufdoctor,
# workflow publish.yml, environment pypi). Until that is configured this job
# fails at the upload step and nothing is published.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
