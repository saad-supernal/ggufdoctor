name: Publish to PyPI

# Uploads with the PYPI_API_TOKEN repository secret (a PyPI API token). The
# token value lives only in GitHub's encrypted secrets; nothing here or in the
# repo carries it. To switch to trusted publishing later: drop `password`,
# add `environment: pypi` and `permissions: id-token: write`, and register the
# publisher on PyPI (owner saad-supernal, repo ggufdoctor, workflow publish.yml).
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
