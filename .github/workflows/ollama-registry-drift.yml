name: Ollama registry drift

on:
  schedule:
    - cron: "17 6 * * 1"   # weekly, Monday 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: compare the vendored registry with Ollama main
        id: cmp
        run: |
          # pipefail matters below: the drift verdict is written by a Python
          # script on the left of a `| tee`, so without it a traceback there
          # is masked by tee's exit 0 and the job reports "no drift" on a run
          # that compared nothing.
          set -eu -o pipefail
          mkdir -p /tmp/head
          : > /tmp/head/.missing
          base=https://raw.githubusercontent.com/ollama/ollama/main/template
          curl -fsSL "$base/index.json" -o /tmp/head/index.json
          for f in src/ggufdoctor/ollama_data/*.gotmpl; do
            name=$(basename "$f")
            curl -fsSL "$base/$name" -o "/tmp/head/$name" || { echo "$name" >> /tmp/head/.missing; rm -f "/tmp/head/$name"; }
          done
          python3 - <<'PY' | tee /tmp/drift.txt
          import json, pathlib, sys, traceback
          # Written before anything that can fail, so an absent file can never
          # be read as "no drift"; any exception below turns it into "1", so a
          # broken comparison escalates rather than passing silently.
          drifted = pathlib.Path("/tmp/drifted")
          drifted.write_text("")
          try:
              vend = pathlib.Path("src/ggufdoctor/ollama_data"); head = pathlib.Path("/tmp/head")
              missing = {l.strip() for l in (head / ".missing").read_text().splitlines() if l.strip()}
              gotmpls = [p.name for p in vend.iterdir() if p.name.endswith(".gotmpl")]
              changed = sorted(missing) + [
                  name for name in gotmpls
                  if name not in missing and (head / name).read_bytes() != (vend / name).read_bytes()
              ]
              hi = json.load(open(head / "index.json")); vi = json.load(open(vend / "index.json"))
              new = [e for e in hi if e not in vi]; gone = [e for e in vi if e not in hi]
              print(f"changed files: {changed}")
              if missing: print(f"removed upstream (404 at HEAD): {sorted(missing)}")
              print(f"index entries added at HEAD: {len(new)}, removed: {len(gone)}")
              for e in new: print("  +", e["name"], repr(e["template"][:80]))
              drifted.write_text("1" if (changed or new or gone) else "")
          except Exception:
              drifted.write_text("1")
              print("drift comparison failed:"); traceback.print_exc(file=sys.stdout)
              raise
          PY
          echo "drifted=$(cat /tmp/drifted)" >> "$GITHUB_OUTPUT"
      - name: open an issue when the registry moved
        if: steps.cmp.outputs.drifted == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Ollama template registry drifted from the vendored pin"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            gh issue create --title "$title" --body-file /tmp/drift.txt --label maintenance || \
            gh issue create --title "$title" --body-file /tmp/drift.txt
          fi
          exit 1
