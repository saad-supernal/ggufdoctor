[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ggufdoctor"
version = "0.3.0"
description = "Lint chat templates embedded in GGUF files"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Saad", email = "saadfarooq404@yahoo.com"},
]
keywords = [
    "gguf", "llama.cpp", "chat-template", "jinja2", "llm",
    "tokenizer", "cli", "lint",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Utilities",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = ["jinja2>=3.1", "wasmtime>=48,<49"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/saad-supernal/ggufdoctor"
Repository = "https://github.com/saad-supernal/ggufdoctor"
Issues = "https://github.com/saad-supernal/ggufdoctor/issues"

[project.scripts]
ggufdoctor = "ggufdoctor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ggufdoctor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "network: hits the real Hugging Face API (deselected by default)",
  "conformance: downloads and runs a pinned llama-server binary (deselected by default)",
  "ollama_conformance: builds Ollama's Go template package at the pin and compares (needs Go; deselected by default)",
]
addopts = "-m 'not network and not conformance and not ollama_conformance'"
